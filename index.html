<!doctype html>
<html lang="en">
<head>

  <title>410 — Gone</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f6f8;
      color: #18212b;
      font: 16px/1.6 system-ui, sans-serif;
      text-align: center;
    }

    main {
      max-width: 560px;
    }

    .code {
      margin: 0;
      color: #526170;
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 800;
      letter-spacing: -0.08em;
      line-height: 1;
    }

    h1 {
      margin: 16px 0 8px;
      font-size: clamp(1.5rem, 5vw, 2rem);
    }

    p { margin: 0; }

    a {
      display: inline-block;
      margin-top: 24px;
      color: #075fc7;
    }

</head>
<body>
  <main>
    <p class="code" aria-hidden="true">410</p>
